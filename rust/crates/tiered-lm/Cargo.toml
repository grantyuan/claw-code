[package]
name = "tiered-lm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(test)'.dependencies]
runtime = { path = "../runtime" }
